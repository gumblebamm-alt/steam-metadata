name: Steam Metadata Auto Tracker

on:
  schedule:
    # Runs twice daily at a jittered minute
    - cron: '17 */12 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Trigger source for diagnostics'
        required: false
        default: 'manual'
      reset_checkpoint:
        description: 'Force reset checkpoint (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: steam-metadata-auto-tracker-main
  cancel-in-progress: false

jobs:
  update-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache applist
        uses: actions/cache@v4
        with:
          path: cache/applist.json
          key: applist-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: applist-${{ runner.os }}-

      - name: Refresh AppList from Steam
        env:
          STEAM_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
        run: |
          if [ -n "$STEAM_KEY" ]; then
            python tracker.py --fetch-applist --steam-key "$STEAM_KEY"
          else
            python tracker.py --fetch-applist
          fi

      - name: Run Tracker
        env:
          STEAM_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
          HUBCAP_KEY: ${{ secrets.HUBCAP_API_KEY }}
          FORCE_RESET: ${{ github.event.inputs.reset_checkpoint }}
        run: |
          CHECKPOINT="cache/checkpoint.json"
          SHOULD_RESET=false

          if [ "$FORCE_RESET" = "true" ]; then
            echo "[Notice] Manual trigger requested checkpoint reset."
            SHOULD_RESET=true
          elif [ ! -f "$CHECKPOINT" ]; then
            echo "[Notice] No checkpoint file found — starting new scan cycle."
            SHOULD_RESET=true
          else
            LAST=$(python3 -c "import json, os; print(int(json.load(open('$CHECKPOINT')).get('updated_at', 0)) if os.path.exists('$CHECKPOINT') else 0)")
            NOW=$(date +%s)
            AGE=$((NOW - LAST))
            DAYS=$((AGE / 86400))
            echo "Checkpoint age: ${DAYS} day(s) (${AGE} seconds)."

            # Reset checkpoint if older than 7 days so all apps get refreshed cyclically
            if [ "$AGE" -gt 604800 ]; then
              echo "[Notice] Checkpoint is older than 7 days — starting fresh scan cycle."
              SHOULD_RESET=true
            fi
          fi

          # Build run command
          ARGS="--run --concurrency 5"
          if [ -n "$STEAM_KEY" ]; then
            ARGS="$ARGS --steam-key $STEAM_KEY"
          fi
          if [ -n "$HUBCAP_KEY" ]; then
            ARGS="$ARGS --hubcap-key $HUBCAP_KEY"
          fi
          if [ "$SHOULD_RESET" = "true" ]; then
            ARGS="$ARGS --reset-checkpoint"
          fi

          echo "Executing: python tracker.py $ARGS"
          python tracker.py $ARGS

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ cache/checkpoint.json
          if git diff --staged --quiet; then
            echo "No new updates found."
          else
            git commit -m "Auto-update: sync latest Steam metadata [skip ci]"
            git pull origin main --rebase --no-edit || true
            git push origin main
          fi
