# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
- test
- secret-detection
sast:
  stage: test
include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml
variables:
  SECRET_DETECTION_ENABLED: 'true'
secret_detection:
  stage: secret-detection

verify-steam-api-key:
  stage: test
  image: python:3.11
  script:
    - python -c "import os, sys; key=os.getenv('STEAM_WEB_API_KEY'); sys.exit('STEAM_WEB_API_KEY is missing') if not key else print('STEAM_WEB_API_KEY is available to GitLab CI (value hidden)')"

update-metadata:
  stage: test
  image: python:3.11
  timeout: 2 hours
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - test -n "$STEAM_WEB_API_KEY" || (echo "STEAM_WEB_API_KEY is missing" && exit 1)
    - python tracker.py --fetch-applist --steam-key "$STEAM_WEB_API_KEY"
    - python tracker.py --run --concurrency 5 --reset-checkpoint
    - git config user.name "gitlab-ci[bot]"
    - git config user.email "gitlab-ci[bot]@noreply.gitlab.com"
    - git add data/ cache/checkpoint.json
    - 'git diff --cached --quiet || git commit -m "Auto-update: sync latest Steam metadata [skip ci]"'
    - git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_COMMIT_REF_NAME}"
